name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies and build assets
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader
          php artisan key:generate --force
          npm ci
          npm run build

      - name: Determine site URL
        id: site
        run: |
          if [[ "$GITHUB_REPOSITORY" == "${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            repository_name="${GITHUB_REPOSITORY#*/}"
            base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}"
          fi
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"

      - name: Export static portfolio
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_URL: ${{ steps.site.outputs.base_url }}
          ASSET_URL: ${{ steps.site.outputs.base_url }}
          SESSION_DRIVER: file
          CACHE_STORE: file
          QUEUE_CONNECTION: sync
        run: |
          mkdir -p dist
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ --output dist/index.html; then
              break
            fi
            sleep 1
          done

          if [ ! -s dist/index.html ]; then
            cat /tmp/laravel.log
            exit 1
          fi

          mkdir -p dist/pengalaman-kerja dist/images dist/documents dist/build
          curl --fail --silent --show-error http://127.0.0.1:8000/pengalaman-kerja --output dist/pengalaman-kerja/index.html
          cp -R public/images/. dist/images/
          cp -R public/documents/. dist/documents/
          cp -R public/build/. dist/build/
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
